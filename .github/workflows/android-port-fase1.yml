name: Android port - APK build (arm64-v8a)

# Run manually from the GitHub "Actions" tab ("Run workflow" button).
# It deliberately does not run on every push -- this step is iterative (compile, see the error,
# fix, repeat), so it still does not make sense to trigger it on every commit.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "release = optimized, for playing; debug = with assertions and symbols, for investigating errors"
        type: choice
        default: android-arm64-release
        options:
          - android-arm64-release
          - android-arm64
      release_tag:
        description: "Release tag (e.g.: v0.3). Empty = only generates the artifact; filled = publishes a release on GitHub with the APK"
        type: string
        default: ""
      release_sem_chave:
        description: "Publish the release even without the fixed key (the APK does not install on top of the previous one)"
        type: boolean
        default: false

env:
  # r29 (clang/libc++ 21): r27 (libc++ 18) has neither std::atomic_ref nor
  # std::from_chars for float, which DataContainer and fif.hpp use.
  NDK_VERSION: r29
  ANDROID_PLATFORM: "30" # Android 11 (the android-arm64* presets use the same value)
  PRESET: ${{ inputs.preset || 'android-arm64-release' }}

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release/tag when release_tag is filled
    steps:
      - uses: actions/checkout@v4

      # Fixed signing key (repository secrets). With it the new APK
      # installs on top of the previous one. A release without the key fails right here, before
      # compilation, so as not to publish an APK that does not update the installed one.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SEM_CHAVE: ${{ inputs.release_sem_chave }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/alice-release.p12"
            echo "ALICE_KEYSTORE=$RUNNER_TEMP/alice-release.p12" >> "$GITHUB_ENV"
            echo "Fixed key found."
          elif [ -n "$RELEASE_TAG" ] && [ "$RELEASE_SEM_CHAVE" != "true" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are missing (see android/README.md, Signing). To publish anyway, check release_sem_chave."
            exit 1
          else
            echo "::warning::Without the fixed key: the APK comes out with a new debug key and does not install on top of another one."
          fi

      # System dependencies required only for the desktop preset CONFIGURE to succeed
      # (GLFW/GLEW check X11/OpenGL at configure time, even though we are only going to
      # build the 5 code generation tools with that preset, not the whole game).
      - name: Install system dependencies (desktop build)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang \
            libgl1-mesa-dev libglvnd-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Desktop build cache (host tools)
        uses: actions/cache@v4
        with:
          path: out/build/x64-debug-linux-clang
          key: host-tools-${{ runner.os }}-${{ hashFiles('dependencies/**/CMakeLists.txt', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            host-tools-${{ runner.os }}-

      - name: Validate the shaders (GLSL ES 3.20 and GLSL 4.60)
        run: |
          sudo apt-get install -y -qq glslang-tools
          android/validate-shaders.sh

      - name: Configure desktop preset
        run: cmake --preset x64-debug-linux-clang

      - name: Build the 5 code generation tools
        run: |
          cmake --build out/build/x64-debug-linux-clang --target \
            ParserGenerator DCONGENERATOR DCONINTERFACEGEN DataContainer-Lua DataContainer_OOS_Reporter \
            -- -j$(nproc)

      - name: Gather the tools into a single folder
        run: |
          mkdir -p native-tools
          find out/build/x64-debug-linux-clang -type f \
            \( -name ParserGenerator -o -name DCONGENERATOR -o -name DCONINTERFACEGEN \
               -o -name DataContainer-Lua -o -name DataContainer_OOS_Reporter \) \
            -exec cp {} native-tools/ \;
          echo "Tools found:"
          ls -la native-tools/

      - name: Install the NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          # no local-cache: the NDK restored from the cache came without clang++ (which is
          # a symbolic link) and the configure failed; downloading takes a few seconds
          local-cache: false

      - name: Android build cache
        uses: actions/cache@v4
        with:
          path: out/build/${{ env.PRESET }}
          key: android-build-v3-${{ env.PRESET }}-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('dependencies/**/CMakeLists.txt', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            android-build-v3-${{ env.PRESET }}-${{ runner.os }}-${{ env.NDK_VERSION }}-

      - name: Configure Android preset
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake --preset "$PRESET" -DALICE_NATIVE_TOOLS_DIR="${{ github.workspace }}/native-tools"

      # -k0 (keep going) so ninja does not stop at the first error -- that way a single
      # run already brings several errors at once to fix, instead of one per round.
      - name: Build for Android (arm64-v8a)
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set +e
          # -j2: in release main.cpp alone uses ~7 GB of memory in the compiler
          cmake --build "out/build/$PRESET" --target Alice -- -k0 -j2 2>&1 | tee android-build.log
          exit ${PIPESTATUS[0]}

      - name: Copy the .so files to the Gradle project
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: android/collect-native-libs.sh "out/build/$PRESET"

      - name: Install JDK 17 (Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the Android SDK already comes installed on the ubuntu-latest runner (ANDROID_HOME)
      - name: Generate the APK
        working-directory: android
        env:
          ALICE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Check the APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > apk-certs.txt
          # the line format changes between apksigner versions; if it does not match, show everything
          grep -E "certificate (DN|SHA-256 digest)" apk-certs.txt || cat apk-certs.txt

      - name: Publish the APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectAlice-arm64-v8a-${{ env.PRESET }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # fixed name: the README points to .../releases/latest/download/ProjectAlice-Android-arm64.apk,
      # which always downloads the APK of the most recent release
      - name: Prepare the APK for the release
        if: ${{ inputs.release_tag != '' }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProjectAlice-Android-arm64.apk

      - name: Publish the release on GitHub
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Project Alice Android ${{ inputs.release_tag }}
          body_path: android/release-notes.md
          # normal release (not pre-release): the "releases/latest" link ignores pre-releases
          make_latest: true
          files: ProjectAlice-Android-arm64.apk

      - name: Publish the build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 14
